name: Build and deploy SystemScope
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: src/systemscope-web/package-lock.json }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: npm ci && npm run build
        working-directory: src/systemscope-web
      - run: dotnet test SystemScope.slnx --configuration Release
      - run: dotnet publish src/SystemScope.Api/SystemScope.Api.csproj -c Release -o publish -p:SkipClientBuild=true
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with: { app-name: '${{ vars.AZURE_WEBAPP_NAME }}', package: publish }
